# Supabase local development config (minimal).
# Run `supabase init` to regenerate a full config if needed.
project_id = "flow-pwa"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

# Anonymous sign-in is required for the creator flow (Section 6.4).
[auth.anonymous_sign_ins]
enabled = true

[edge_runtime]
enabled = true
